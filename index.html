<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Entry Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .link-container {
            margin-top: 20px;
        }

        .link-container a {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .link-container a:hover {
            background-color: #0056b3;
        }

        img {
            max-width: 100px;
            height: auto;
        }
    </style>
</head>

<body>
    <h1>Welcome to the Portal</h1>
    <div class="link-container">
        <a href="http://192.168.0.24:5678/home/workflows" target="_blank">
            <img src="data/n8n.png" alt="n8n Icon">
            <span>n8n Server</span>
        </a>
        <!-- Add more links as needed -->
    </div>
</body>

</html>
